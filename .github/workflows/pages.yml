name: Pages

# GitHub Pages can only serve from the repository root or /docs when it builds
# from a branch. This workflow publishes docs/pages/ instead, so the site keeps
# the same layout that Cloudflare Pages uses (publish directory docs/pages).
#
# Required once, in repository settings: Pages, Build and deployment,
# Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "docs/pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/pages

      - id: deployment
        uses: actions/deploy-pages@v4
