name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Contributor Sign-off (CLA / DCO)
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') && github.actor != 'github-actions[bot]'
        run: |
          if [[ "${{ github.head_ref }}" =~ ^release-please-- ]] || [[ "${{ github.actor }}" == *"bot"* ]]; then
            echo "Skipping CLA check for automated bot PR."
            exit 0
          fi
          base="origin/${{ github.base_ref || 'main' }}"
          echo "Verifying Signed-off-by trailers on PR commits against $base..."
          missing=0
          for commit in $(git rev-list --no-merges "${base}..HEAD"); do
            subject=$(git log -1 --format="%s" "$commit")
            body=$(git log -1 --format="%B" "$commit")
            if ! echo "$body" | grep -E -q "^Signed-off-by: [^<]+ <[^@]+@[^>]+>"; then
              echo "❌ Error: Commit $commit lacks a valid 'Signed-off-by' trailer."
              echo "   Subject: $subject"
              missing=$((missing + 1))
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "========================================================================"
            echo "Thermal requires all external contributions to accept the Contributor"
            echo "License Agreement (CLA) documented in CONTRIBUTING.md."
            echo "Every code commit must carry a 'Signed-off-by: Name <email>' trailer."
            echo ""
            echo "To fix your commits:"
            echo "  Single commit:  git commit --amend -s && git push --force-with-lease"
            echo "  Multi-commit:   git rebase --signoff $base && git push --force-with-lease"
            echo "========================================================================"
            exit 1
          fi
          echo "✅ All PR commits contain valid Signed-off-by trailers."

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify Formatting (gofmt)
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            go test -v -race ./...
          else
            go test -v ./...
          fi
        shell: bash

      - name: Verify Multi-Target Cross-Compilation
        if: matrix.os == 'ubuntu-latest'
        run: |
          for target in "linux/amd64" "linux/arm64" "darwin/amd64" "darwin/arm64" "windows/amd64"; do
            os="${target%%/*}"
            arch="${target##*/}"
            echo "Cross-compiling for $os/$arch..."
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null ./cmd/thermal
          done
        shell: bash

      - name: Simulated User Testing Release Gate
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/simulated_user_gate.sh

      - name: Vulnerability Check (govulncheck)
        if: matrix.os == 'ubuntu-latest'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

